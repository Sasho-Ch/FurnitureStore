<div class="profile-container">
    <h1 class="profile-title">Your Profile</h1>
  
    <div class="profile-card" *ngIf="!isEditing">
      <div class="profile-item">
        <label>Username:</label>
        <span> {{profileData.username}} </span>
      </div>
      <div class="profile-item">
        <label>Email:</label>
        <span> {{profileData.email}}  </span>
      </div>
      <div class="profile-item">
        <label>Phone Number:</label>
        <span> {{profileData.tel}} </span>
      </div>
      <button class="edit-btn" (click)="toggleEditMode()">Edit</button>
    </div>
  
    <form [formGroup]="form" (ngSubmit)="handleSaveProfile()" class="profile-form" *ngIf="isEditing">
      <div class="form-item">
        <label for="username">Username:</label>
        <input type="text" id="username" formControlName="username" />
      </div>
      <div class="form-item">
        <label for="email">Email:</label>
        <input type="email" id="email" formControlName="email"/>
      </div>
      <div class="form-item">
        <label for="tel">Phone Number:</label>
        <input type="text" id="tel" formControlName="tel"/>
      </div>
      <div class="form-actions">
        <button class="save-btn" >Save</button>
        <button class="cancel-btn" (click)="onCancel($event)">Cancel</button>
      </div>
    </form>
  </div>
