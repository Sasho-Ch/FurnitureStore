<div class="body">
<div class="gallery-container">
    <div class="gallery-card" *ngFor="let item of furnitures">
      <a [routerLink]="item._id">
      <div class="card-image">
        <img [src]="item.img" alt="{{ item.model }}" />
      </div>
      <div class="card-info">
        <h3>{{ item.model }}</h3>
        <p class="price">Price: ${{ item.price }}</p>
      </div>
      </a>
    </div>
  </div>
  </div>
